name: Pruebas Automaticas

on:
  push:
    branches:
      - main
      - develop
      - release

jobs:
  testear-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Pruebas
        run: npm test

